<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <title>SFHS Control Feedback Cue Proof</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main>
      <p class="eyebrow">SFHS / optional browser cue transports</p>
      <h1>Sound and Haptic Proof</h1>
      <p>Unlock sound with a real gesture, then use the same symbolic control cues for audio and best-effort vibration.</p>
      <div class="toolbar">
        <button id="unlock" type="button">Unlock sound</button>
        <button id="mute" type="button" aria-pressed="false">Mute</button>
      </div>
      <div id="control" class="mount"></div>
      <output id="diagnostic" aria-live="polite">ready</output>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
