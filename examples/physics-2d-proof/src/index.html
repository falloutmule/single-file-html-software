<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <title>SFHS Physics 2D Proof</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main id="fixture-shell" data-phase="ready">
      <header>
        <div>
          <p class="eyebrow">SFHS / Rapier 2D</p>
          <h1>Physics 2D Proof</h1>
        </div>
        <output id="status" aria-live="polite">Ready</output>
      </header>
      <canvas id="world" width="720" height="480" aria-label="Bouncing shapes physics proof"></canvas>
      <div class="controls">
        <button id="fixture-start" type="button">Start</button>
        <button id="impulse" type="button">Impulse</button>
        <button id="restart" type="button">Restart</button>
      </div>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
